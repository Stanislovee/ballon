backend:
  name: git-gateway
  branch: main
  # Додаємо register: true, щоб CMS показувала форму створення пароля
  register: true

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Налаштування сайту"
    files:
      - name: "general"
        label: "Зовнішній вигляд (Кольори, Шрифти)"
        file: "content/theme.json"
        fields:
          - { label: "Колір фону сайту", name: "bg_color", widget: "color", default: "#FFFFFF" }
          - { label: "Колір тексту", name: "text_color", widget: "color", default: "#4A3B33" }
          - { label: "Колір заголовків", name: "heading_color", widget: "color", default: "#6B4A38" }
          - { label: "Колір кнопок", name: "button_color", widget: "color", default: "#4E3527" }
          - { label: "Колір фону шапки", name: "header_bg", widget: "color", default: "#E9DEC7" }
          - { label: "Шрифт для заголовків (наприклад, чеський)", name: "heading_font", widget: "select", options: ["Playfair Display", "Georgia", "Arial", "Times New Roman", "Roboto"] }
          - { label: "Шрифт для тексту", name: "body_font", widget: "select", options: ["Manrope", "Arial", "Verdana", "Helvetica", "Roboto"] }
          - { label: "Розмір шрифту (px)", name: "base_font_size", widget: "number", default: 16, min: 12, max: 24, value_type: "int" }
          - { label: "Розмір заголовків (px)", name: "heading_size", widget: "number", default: 34, min: 20, max: 60, value_type: "int" }
      - name: "texts"
        label: "Тексти та Логотип (Мова)"
        file: "content/settings.json"
        fields:
          - { label: "Текстовий логотип (наприклад, чеською)", name: "site_title", widget: "string", default: "Подари<br>Шар 38" }
          - { label: "Завантажити фото логотипу (опціонально)", name: "logo_image", widget: "image", required: false }
          - { label: "Телефон", name: "phone", widget: "string", default: "+7 980 846 54 08" }
          - { label: "Адреса", name: "address", widget: "text", default: "г. Иркутск,<br>ул. Байкальская 346/2" }
          - { label: "Заголовок Hero (чеською)", name: "hero_title", widget: "string", default: "Воздушные шары, которые превращают ваш праздник в незабываемое событие!" }
          - { label: "Текст Hero (чеською)", name: "hero_text", widget: "text", default: "Доставка до двери точно в срок. Создаем трендовые композиции." }
          - { label: "Заголовок Популярних товарів", name: "popular_title", widget: "string", default: "Популярные наборы со скидкой" }
          - { label: "Заголовок Каталогу", name: "catalog_title", widget: "string", default: "Каталог воздушных наборов" }
          - { label: "Заголовок Футера", name: "footer_title", widget: "string", default: "Мы работаем для Вас" }
          - { label: "Адреса в Футері", name: "footer_address", widget: "text", default: "по адресу: г. Иркутск, мкр-н. Солнечный, ул. Байкальская, 346/2" }
          - { label: "Графік роботи", name: "footer_schedule", widget: "text", default: "Прием заказов с 9.00 до 19.00 ч." }
          - { label: "Копірайт", name: "footer_copyright", widget: "string", default: "© Подари Шар 38, Иркутск. Все права защищены." }

  - name: "products"
    label: "Товари"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Назва товару", name: "title", widget: "string" }
      - { label: "Ціна", name: "price", widget: "number", value_type: "int" }
      - { label: "Стара ціна", name: "old_price", widget: "number", value_type: "int", required: false }
      - { label: "Фото", name: "image", widget: "image" }
      - { label: "Короткий опис", name: "desc", widget: "text" }
      - { label: "Посилання", name: "link", widget: "string", default: "#" }

  - name: "reviews"
    label: "Відгуки"
    folder: "content/reviews"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Дата", name: "date", widget: "string" }
      - { label: "Текст відгуку", name: "text", widget: "text" }

  - name: "faq"
    label: "Питання (FAQ)"
    folder: "content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Питання", name: "question", widget: "string" }
      - { label: "Відповідь", name: "answer", widget: "text" }